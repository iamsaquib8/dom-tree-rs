version: 2
updates:
  # Keep the CI/release/pages workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      # Referenced by branch (@stable, @nightly, @master); its version-named
      # tags select a Rust toolchain, so bumping them would change the MSRV.
      - dependency-name: dtolnay/rust-toolchain

  # Rust: the core crate's optional/dev dependencies, the derive crate (syn,
  # quote), and the separate crates for wasm, Python, benchmarks and fuzzing.
  # The default build of the core has no dependencies.
  - package-ecosystem: cargo
    directories: ["/", "/wasm", "/python", "/benchmarks", "/fuzz"]
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      # markup5ever_rcdom (html5ever's reference tree, used by the benchmark
      # comparison and the differential fuzz target) still requires html5ever
      # 0.39. Lift this once it supports a newer html5ever.
      - dependency-name: html5ever
        versions: [">=0.40"]

  # Python build requirements (maturin) in python/pyproject.toml.
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: monthly
