name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (default)
        run: cargo test
      - name: Test (no default features, json only)
        run: cargo test --no-default-features --features json

  msrv:
    name: msrv (1.70)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.70.0
      - uses: Swatinem/rust-cache@v2
      - name: Check library on MSRV (all lib features)
        run: cargo check --no-default-features --features json,serde,query

  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings

  no_std:
    name: no_std (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build for a bare-metal target (alloc only)
        run: cargo build --no-default-features --features json,query --target thumbv7em-none-eabi

  wasm:
    name: wasm build + size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm (web target)
        working-directory: dom-tree-wasm
        run: wasm-pack build --target web --release
      - name: Test wasm (node)
        working-directory: dom-tree-wasm
        run: wasm-pack test --node
      - name: Gzipped size gate (< 30 KB)
        working-directory: dom-tree-wasm
        run: |
          SIZE=$(gzip -9 -c pkg/dom_tree_wasm_bg.wasm | wc -c)
          echo "gzipped wasm: $SIZE bytes (budget 30720)"
          test "$SIZE" -lt 30720

  fuzz:
    name: fuzz (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke run (parse, 30s)
        run: cargo fuzz run parse -- -max_total_time=30
