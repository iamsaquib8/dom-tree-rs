name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Test (all features)
        run: cargo test --all-features
      - name: Test (default)
        run: cargo test
      - name: Test (no default features, json only)
        run: cargo test --no-default-features --features json
      - name: Test CLI
        run: cargo test -p domtree-cli
      - name: Zero runtime dependencies (default features)
        run: |
          DEPS=$(cargo tree -p dom-tree-rs -e normal --prefix none | sort -u | wc -l)
          echo "crates in default graph: $DEPS (expect 1: this crate)"
          test "$DEPS" -eq 1

  msrv:
    name: msrv (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The MSRV comes from the `toolchain` input, not the action's ref, so
      # Dependabot can't bump it (dependabot.yml also ignores this action).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check library on MSRV (all lib features)
        run: cargo check --no-default-features --features json,serde,query,markdown,std
      - name: Check CLI on MSRV
        run: cargo check -p domtree-cli

  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  no_std:
    name: no_std (thumbv7em)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: Build for a bare-metal target (alloc only)
        run: cargo build --no-default-features --features json,query,markdown --target thumbv7em-none-eabi

  wasm:
    name: wasm + npm package (build, test, size gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dom-tree-wasm
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - name: rustfmt + clippy (bindings)
        working-directory: dom-tree-wasm
        run: |
          cargo fmt --check
          # Library and tests separately: built together (--all-targets), the
          # test-only deps switch on wasm-bindgen's `std`, which clashes with the
          # library's own no_std panic handler.
          cargo clippy --target wasm32-unknown-unknown --release -- -D warnings
          cargo clippy --target wasm32-unknown-unknown --tests -- -D warnings
      # The published feature set (json + query + markdown) is fixed in
      # dom-tree-wasm/Cargo.toml, so this builds exactly what goes to npm.
      - name: Build the npm package
        working-directory: dom-tree-wasm
        run: |
          wasm-pack build --target web --release
          node npm/finish.mjs
      - name: Test the bindings (wasm-bindgen-test, Node)
        working-directory: dom-tree-wasm
        run: wasm-pack test --node
      - name: Smoke-test the packed npm package in Node
        working-directory: dom-tree-wasm
        run: sh npm/smoke-test.sh
      - name: Gzipped size gate (< 45 KiB)
        working-directory: dom-tree-wasm
        run: |
          # Measured ~40,800-41,000 bytes (gzip -9) after the review hardening
          # (raw-text escaping, name validation, bounded selector memo); the
          # budget is that rounded up to the next 5 KiB. Raise it on purpose,
          # never by accident.
          SIZE=$(gzip -9 -c pkg/dom_tree_wasm_bg.wasm | wc -c)
          echo "gzipped wasm: $SIZE bytes (budget 46080)"
          test "$SIZE" -lt 46080

  fuzz:
    name: fuzz (build + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo fuzz build
      - name: Smoke run (parse, 30s)
        run: cargo fuzz run parse -- -max_total_time=30
      - name: Smoke run (select, 30s)
        run: cargo fuzz run select -- -max_total_time=30
      - name: Smoke run (markdown, 30s)
        run: cargo fuzz run markdown -- -max_total_time=30
