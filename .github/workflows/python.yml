name: Python

# Builds and tests the Python package (`pip install dom-tree-rs`, import name
# `domtree`; sources in python/). abi3 wheels — one per platform, for every
# CPython >= 3.9 — are built for Linux (manylinux x86_64 + aarch64), macOS
# (x86_64 + arm64) and Windows, plus an sdist.
#
# On a `v*` tag the wheels and sdist are published to PyPI with trusted
# publishing (OIDC): no API token is stored in this repository. One-time setup:
#   1. On PyPI (Account settings -> Publishing -> "Add a new pending
#      publisher"): project `dom-tree-rs`, owner `iamsaquib8`, repository
#      `dom-tree-rs`, workflow `python.yml`, environment `pypi`.
#   2. Optional: GitHub creates the `pypi` environment on first use; under
#      Settings -> Environments you can restrict it to `v*` tags or require a
#      reviewer before anything is uploaded.
# The version published is python/Cargo.toml's; it must match the tag.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "src/**"
      - "Cargo.toml"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The abi3 floor and the newest stable CPython.
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - name: rustfmt + clippy (bindings)
        run: |
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin pytest
          maturin build --release --manifest-path python/Cargo.toml --out python/dist
      - name: Install wheel
        run: python -m pip install --no-index --find-links python/dist dom-tree-rs
      # Run from the repository root so `import domtree` picks up the installed
      # wheel, not the python/domtree/ source directory.
      - name: pytest
        run: python -m pytest -q python/tests
      - name: Check type stubs against the runtime (stubtest)
        if: matrix.python == '3.13'
        run: |
          python -m pip install mypy
          python -m mypy.stubtest domtree

  linux:
    name: wheel (linux ${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: Smoke-test the wheel
        if: matrix.target == 'x86_64'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install pytest
          .venv/bin/pip install --no-index --find-links python/dist dom-tree-rs
          .venv/bin/python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: python/dist

  macos:
    name: wheel (macos ${{ matrix.target }})
    # Apple Silicon runner; the x86_64 wheel is cross-compiled.
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          args: --release --out dist
      - name: Smoke-test the wheel
        if: matrix.target == 'aarch64'
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links python/dist dom-tree-rs
          python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: python/dist

  windows:
    name: wheel (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x64
          args: --release --out dist
      - name: Smoke-test the wheel
        run: |
          python -m pip install pytest
          python -m pip install --no-index --find-links python/dist dom-tree-rs
          python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: python/dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' python/Cargo.toml | head -n1)
          echo "python/Cargo.toml version: $VERSION, tag: $GITHUB_REF_NAME"
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/dist

  publish:
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    # Must match the environment name configured on PyPI's trusted publisher.
    environment:
      name: pypi
      url: https://pypi.org/project/dom-tree-rs/
    permissions:
      # OIDC token for PyPI trusted publishing — no API token needed.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
