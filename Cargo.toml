[package]
name = "domq"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Tiny, zero-dependency, forgiving HTML parser: turn messy real-world HTML into a clean DOM tree (and JSON). WASM-first, no_std-friendly."
repository = "https://github.com/iamsaquib8/domq"
homepage = "https://github.com/iamsaquib8/domq"
documentation = "https://docs.rs/domq"
readme = "README.md"
license = "MIT"
keywords = ["html", "parser", "css-selector", "markdown", "wasm"]
categories = ["parser-implementations", "wasm", "web-programming", "no-std"]
exclude = ["/.github", "/benchmarks", "/fuzz", "/wasm", "/cli", "/derive", "/python", "/packaging", "/playground", "/docs/launch"]

[lib]
name = "domq"

[features]
default = ["json", "query", "markdown"]
# Built-in, zero-dependency JSON serializer (`Dom::to_json`).
json = []
# Optional `serde::Serialize` impls on the tree (pulls in `serde`).
serde = ["dep:serde"]
# Hand-rolled CSS selector engine (`Dom::select`, `Selector`). Zero-dependency.
query = []
# Zero-dependency HTML -> Markdown (`Dom::to_markdown`).
markdown = []
# The complete WHATWG named character reference table (2,125 names) instead of
# the curated ~180. Off by default to keep the default build small.
entities-full = []
# Enables std-only conveniences (e.g. `std::error::Error` for `ParseError`).
# The crate is `no_std + alloc` by default.
std = []
# SIMD-accelerated scanning of text and attribute values via `memchr` (adds
# that one dependency, `no_std`). Off by default: the default build stays
# zero-dependency and produces exactly the same tokens.
simd = ["dep:memchr"]
# `#[derive(FromHtml)]`: declarative extraction into structs. Re-exports the
# proc-macro from the `domq-derive` companion crate (which pulls in `syn`,
# `quote` and `proc-macro2` at compile time only). The traits it implements
# (`FromHtml`, `Dom::extract`, …) come with `query` and need no extra crates.
derive = ["query", "dep:domq-derive"]

[[example]]
name = "to_markdown"
required-features = ["query", "markdown"]

[[test]]
name = "extract"
required-features = ["derive", "markdown"]

[[test]]
name = "extract_derive_properties"
required-features = ["derive"]

[dependencies]
serde = { version = "1", default-features = false, features = ["alloc"], optional = true }
memchr = { version = "2.7", default-features = false, optional = true }
domq-derive = { path = "derive", version = "0.4.0", optional = true }

[dev-dependencies]
# Snapshot testing for the corpus suite (dev-only; not a runtime dependency).
insta = "1"
# Property tests: "never panics", arena-invariant checks.
proptest = "1"
# Drives the `serde` Serialize impl in the JSON-equality roundtrip test.
serde_json = "1"

[package.metadata.docs.rs]
# Document all features (incl. query + serde) on docs.rs.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = true

[workspace]
resolver = "2"
# The `domq` command-line tool and the `#[derive(FromHtml)]` proc-macro
# crate. They share this crate's lockfile and target dir.
members = ["cli", "derive"]
# The WASM bindings, the Python bindings, the comparison benchmarks, and the
# fuzz harness are independent crates with their own (heavier) dependency
# graphs and release profiles, so they are kept out of this crate's pristine,
# minimal-dep graph.
exclude = ["wasm", "python", "benchmarks", "fuzz"]
