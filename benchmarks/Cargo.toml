[package]
name = "domq-benchmarks"
version = "0.0.0"
publish = false
edition = "2024"

# Independent crate (excluded from the main workspace) so its heavier
# benchmark-only dependencies never touch the published crate's graph. The
# empty `[workspace]` keeps cargo from looking further up for one (e.g. when
# this checkout sits inside another cargo workspace).
[workspace]

[features]
# Measure the optional memchr-backed scanning: `cargo bench --features simd`.
simd = ["domq/simd"]

[dependencies]
domq = { path = "..", features = ["json", "query"] }

[dev-dependencies]
criterion = "0.8"
tl = "0.7"
scraper = "0.29"
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[[bench]]
name = "parse"
harness = false
