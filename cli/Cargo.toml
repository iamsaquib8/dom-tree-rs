[package]
name = "domq-cli"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Query HTML from the command line with CSS selectors — get elements, attributes, readable text, Markdown or JSON. A tiny, zero-dependency, htmlq-compatible CLI."
repository = "https://github.com/iamsaquib8/domq"
homepage = "https://github.com/iamsaquib8/domq/tree/main/cli"
readme = "README.md"
license = "MIT"
keywords = ["html", "cli", "css-selector", "scraping", "markdown"]
categories = ["command-line-utilities", "parser-implementations", "web-programming"]

[[bin]]
name = "domq"
path = "src/main.rs"

[dependencies]
domq = { path = "..", version = "0.4", default-features = false, features = ["json", "query", "markdown", "std"] }

# `cargo binstall domq-cli` downloads the prebuilt binary from the GitHub
# release (built by .github/workflows/release.yml) instead of compiling.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/domq-v{ version }-{ target }{ archive-suffix }"
bin-dir = "domq-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
