<text x="390.0" y="21" text-anchor="middle" class="title">domtree — zero-dependency HTML in your shell</text>
<g clip-path="url(#c)">
<g class="b" style="animation-delay:0.3s"><text x="22" y="56" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="t">curl </tspan><tspan class="f">-sL</tspan><tspan class="t"> rust-lang.org </tspan><tspan class="p">|</tspan><tspan class="t"> </tspan><tspan class="k">domtree</tspan><tspan class="t"> </tspan><tspan class="f">-wt</tspan><tspan class="t"> </tspan><tspan class="s">'nav a'</tspan><tspan class="t"> </tspan><tspan class="p">|</tspan><tspan class="t"> head </tspan><tspan class="f">-4</tspan></text><text x="22" y="76" xml:space="preserve">Install</text><text x="22" y="96" xml:space="preserve">Learn</text><text x="22" y="116" xml:space="preserve">Playground</text><text x="22" y="136" xml:space="preserve">Tools</text></g>
<g class="b" style="animation-delay:1.7s"><text x="22" y="176" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="t">curl </tspan><tspan class="f">-sL</tspan><tspan class="t"> rust-lang.org </tspan><tspan class="p">|</tspan><tspan class="t"> </tspan><tspan class="k">domtree</tspan><tspan class="t"> </tspan><tspan class="f">--markdown</tspan><tspan class="t"> </tspan><tspan class="f">-1</tspan><tspan class="t"> section </tspan><tspan class="p">|</tspan><tspan class="t"> head </tspan><tspan class="f">-5</tspan></text><text x="22" y="196" class="md" xml:space="preserve">## Why Rust?</text><text x="22" y="236" class="md" xml:space="preserve">### Performance</text><text x="22" y="276" xml:space="preserve">Rust is blazingly fast and memory-efficient: with no runtime or garbage collector, it can power performance-critical services, run on embedded devices, and easily integrate with other languages.</text></g>
<g class="b" style="animation-delay:3.1s"><text x="22" y="316" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="t">echo </tspan><tspan class="s">'&lt;img src=a.png&gt;&lt;img src=b.png alt=B&gt;&lt;img src=c.png&gt;'</tspan><tspan class="t"> </tspan><tspan class="p">|</tspan><tspan class="t"> </tspan><tspan class="k">domtree</tspan><tspan class="t"> </tspan><tspan class="f">-c</tspan><tspan class="t"> </tspan><tspan class="s">'img:not([alt])'</tspan></text><text x="22" y="336" class="num" xml:space="preserve">2</text></g>
<g class="b" style="animation-delay:4.5s"><text x="22" y="376" xml:space="preserve"><tspan class="prompt">$ </tspan><tspan class="t">echo </tspan><tspan class="s">'&lt;ul&gt;&lt;li&gt;a&lt;li&gt;b&lt;/ul&gt;'</tspan><tspan class="t"> </tspan><tspan class="p">|</tspan><tspan class="t"> </tspan><tspan class="k">domtree</tspan><tspan class="t"> </tspan><tspan class="f">-p</tspan></text><text x="22" y="396" class="tag" xml:space="preserve">&lt;ul&gt;</text><text x="22" y="416" class="tag" xml:space="preserve">  &lt;li&gt;a&lt;/li&gt;</text><text x="22" y="436" class="tag" xml:space="preserve">  &lt;li&gt;b&lt;/li&gt;</text><text x="22" y="456" class="tag" xml:space="preserve">&lt;/ul&gt;</text></g>
</g>
