<svg xmlns="http://www.w3.org/2000/svg" width="780" height="494" viewBox="0 0 780 494" role="img" aria-labelledby="t d">
<title id="t">domtree demo</title>
<desc id="d">Terminal session: domtree lists the navigation links of rust-lang.org, converts its first section to Markdown, counts images without alt text, and pretty-prints a fragment with unclosed list items.</desc>
<style>
text { font: 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; fill: #c9d1d9; white-space: pre; }
.prompt { fill: #7ee787; font-weight: 600; }
.k { fill: #fb923c; font-weight: 700; }
.s { fill: #a5d6ff; }
.f { fill: #d2a8ff; }
.p { fill: #6e7681; }
.md { fill: #79c0ff; font-weight: 600; }
.num { fill: #fb923c; font-weight: 700; }
.tag { fill: #7ee787; }
.title { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #8b949e; }
.b { animation: in .45s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .b { animation: none; } }
</style>
<defs><clipPath id="c"><rect x="22" y="0" width="736" height="494"/></clipPath></defs>
