[package]
name = "dom-tree-wasm"
version = "0.2.0"
edition = "2021"
rust-version = "1.70"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "WebAssembly bindings for dom-tree-rs: parse messy HTML into a JSON tree in the browser, edge, or any JS runtime."
repository = "https://github.com/iamsaquib8/dom-tree-rs"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Expose `query(html, selector)` (pulls in the selector engine).
query = ["dom-tree-rs/query"]

[dependencies]
wasm-bindgen = "0.2"
# Only the default `json` feature of the core crate — no serde, zero deps.
dom-tree-rs = { path = "..", default-features = false, features = ["json"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

# Optimise hard for code size — this is the whole pitch.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# Aggressive size optimisation. The `--enable-*` flags let the bundled wasm-opt
# accept the wasm features modern rustc emits by default (bulk-memory, sign-ext,
# …); without them wasm-opt rejects the module.
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-mutable-globals",
]
