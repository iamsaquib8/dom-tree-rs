[package]
name = "domq-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace: never picked up by (or looking for) another one.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
domq = { path = "..", features = ["json", "query", "markdown"] }
# The reference parser for the `differential` target.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tokenize"
path = "fuzz_targets/tokenize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "select"
path = "fuzz_targets/select.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "differential"
path = "fuzz_targets/differential.rs"
test = false
doc = false
bench = false

# Fuzz binaries want a release-ish profile with debug assertions on.
[profile.release]
debug = 1
