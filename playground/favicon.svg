<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="dom-tree-rs logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- angle brackets -->
  <path d="M30 40 L14 64 L30 88" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M98 40 L114 64 L98 88" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- tree edges -->
  <g stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M64 38 L46 64"/>
    <path d="M64 38 L82 64"/>
    <path d="M82 64 L72 90"/>
    <path d="M82 64 L92 90"/>
  </g>
  <!-- tree nodes -->
  <circle cx="64" cy="36" r="9" fill="url(#accent)"/>
  <circle cx="46" cy="66" r="7" fill="#f8fafc"/>
  <circle cx="82" cy="66" r="7" fill="#f8fafc"/>
  <circle cx="72" cy="92" r="6" fill="#94a3b8"/>
  <circle cx="92" cy="92" r="6" fill="#94a3b8"/>
</svg>
