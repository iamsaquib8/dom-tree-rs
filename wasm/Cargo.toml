[package]
name = "domq-wasm"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
authors = ["iamsaquib8 <saquibulhassan6@gmail.com>"]
description = "Tiny, forgiving HTML parser for JavaScript (WebAssembly): CSS selectors, readable text, Markdown and JSON from messy HTML. Zero JS dependencies."
repository = "https://github.com/iamsaquib8/domq"
homepage = "https://iamsaquib8.github.io/domq/"
documentation = "https://github.com/iamsaquib8/domq/tree/main/wasm#readme"
readme = "README.md"
license = "MIT"
# wasm-pack copies these into the npm package.json (npm allows any number).
keywords = ["html", "parser", "css-selector", "markdown", "wasm", "scraper", "html-to-markdown", "html-to-text", "dom", "cloudflare-workers"]
categories = ["wasm", "parser-implementations", "web-programming"]

# tests/web.rs is compiled into the library itself (see the bottom of
# src/lib.rs), not as a separate integration-test crate.
autotests = false

[lib]
# cdylib only. Adding "rlib" (which integration tests would need) makes the
# optimised module ~9 KB gzipped bigger (measured: 36,618 -> 45,370 bytes).
crate-type = ["cdylib"]

[dependencies]
# `no_std`: drops std's panic/formatting machinery from the module.
wasm-bindgen = { version = "0.2.100", default-features = false }
# The allocator std itself uses on wasm32-unknown-unknown.
dlmalloc = { version = "0.2", features = ["global"] }
# The core parser with exactly the features the JS API exposes — no serde,
# zero transitive dependencies.
domq = { path = "..", default-features = false, features = ["json", "query", "markdown"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
# Only to inspect returned JS values in the tests; not linked into the module.
js-sys = "0.3"

# Optimise hard for code size — this is the whole pitch.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
# Aggressive size optimisation. The `--enable-*` flags let the bundled wasm-opt
# accept the wasm features modern rustc emits by default (bulk-memory, sign-ext,
# …); without them wasm-opt rejects the module.
wasm-opt = [
    "-Oz",
    "--enable-bulk-memory",
    "--enable-sign-ext",
    "--enable-nontrapping-float-to-int",
    "--enable-mutable-globals",
]
